<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · EZ Minecraft Server</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0e10;
        --surface: #16181c;
        --border: #2a2e35;
        --border-strong: #3a3f47;
        --text: #ecedee;
        --muted: #9aa1ab;
        --faint: #6b727c;
        --accent: #3ecf8e;
        --accent-strong: #2fb67a;
        --accent-ink: #062014;
        --accent-soft: rgba(62, 207, 142, 0.12);
        --critical: #e66767;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        width: min(380px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 1.75rem;
      }
      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 7px;
        background: linear-gradient(180deg, #5cb85c 0 34%, #3f8f3a 34% 42%, #8b5a2b 42% 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .brand-title { font-weight: 650; font-size: 1.05rem; }
      .brand-sub { color: var(--faint); font-size: 0.8rem; }
      h1 { margin: 0 0 0.25rem; font-size: 1.3rem; font-weight: 650; }
      p { margin: 0 0 1.5rem; color: var(--muted); }
      label {
        display: block;
        margin-bottom: 0.35rem;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 500;
      }
      input {
        width: 100%;
        min-height: 40px;
        margin-bottom: 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      input:hover { border-color: var(--border-strong); }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      button {
        width: 100%;
        min-height: 40px;
        margin-top: 0.5rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--accent-strong); }
      button:disabled { opacity: 0.6; cursor: progress; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .error {
        min-height: 1.2rem;
        margin-top: 0.9rem;
        color: var(--critical);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <div>
          <div class="brand-title">EZ Minecraft</div>
          <div class="brand-sub">Server Dashboard</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <p>Use the credentials set on the server machine.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="login-button" type="submit">Sign in</button>
      </form>
      <div id="error-message" class="error" aria-live="polite"></div>
    </main>

    <script>
      function buildBasicAuth(username, password) {
        return 'Basic ' + btoa(username + ':' + password);
      }

      function showError(message) {
        document.getElementById('error-message').textContent = message || '';
      }

      window.addEventListener('load', () => {
        const username = sessionStorage.getItem('ez_auth_username');
        const password = sessionStorage.getItem('ez_auth_password');
        if (username && password) {
          window.location.href = '/dashboard';
        }
      });

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const button = document.getElementById('login-button');
        if (!username || !password) {
          showError('Both username and password are required.');
          return;
        }

        button.disabled = true;
        showError('');
        try {
          const response = await fetch('/api/status', {
            headers: { Authorization: buildBasicAuth(username, password) },
          });
          if (response.status === 401) {
            throw new Error('Wrong username or password.');
          }
          if (!response.ok) {
            throw new Error(`Server error (HTTP ${response.status}).`);
          }
          sessionStorage.setItem('ez_auth_username', username);
          sessionStorage.setItem('ez_auth_password', password);
          window.location.href = '/dashboard';
        } catch (error) {
          showError(error.message || 'Authentication failed.');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
