name: Tests

# Every push and PR to the shared branches. The self-updater fast-forwards installs to `main`,
# so a red build here must never reach it.
on:
  push:
    branches: [development, release, main]
  pull_request:
    branches: [development, release, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (hermetic, random order)
        run: python -m pytest -rf  # not -q: the header shows the --randomly-seed to reproduce failures
      - name: JavaScript syntax
        shell: bash
        run: for file in webapp/static/js/*.js; do node --check "$file"; done
      - name: Shell script syntax
        if: runner.os == 'Linux'
        run: for file in *.sh; do bash -n "$file"; done
